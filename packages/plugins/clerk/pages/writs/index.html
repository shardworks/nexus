<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writs</title>
  <style>
    .error-msg { color: var(--red, #f7768e); font-size: 0.875rem; margin-top: 0.25rem; }
    .warn-msg  { color: var(--yellow, #e0af68); font-size: 0.875rem; margin-top: 0.25rem; }
    .badge--draft { background: var(--purple, #9d7cd8); color: var(--bg, #1a1b26); }
    .detail-row td { background: var(--bg2, #1a1b26); padding: 1rem; }
    .detail-row pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: monospace; max-height: 280px; overflow-y: auto; }
    .detail-section { margin-bottom: 1rem; }
    .detail-section h4 { margin: 0 0 0.4rem; font-size: 0.875rem; text-transform: uppercase; opacity: 0.6; }
    .detail-grid { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; font-size: 0.875rem; }
    .detail-grid dt { opacity: 0.6; }
    .link-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; margin-bottom: 0.25rem; }
    .link-dir { font-weight: bold; opacity: 0.5; }
    .link-id { cursor: pointer; text-decoration: underline; color: var(--blue, #7aa2f7); }
    .link-id:hover { opacity: 0.8; }
    .add-link-form { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-end; margin-top: 0.5rem; }
    .add-link-form input { padding: 0.3rem 0.5rem; background: var(--bg3, #24283b); border: 1px solid var(--border, #414868); border-radius: 4px; color: inherit; font-size: 0.875rem; }
    .confirm-section { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-end; margin-top: 0.5rem; padding: 0.75rem; background: var(--bg3, #24283b); border-radius: 6px; }
    .confirm-section label { font-size: 0.875rem; opacity: 0.8; }
    .confirm-section input { padding: 0.3rem 0.5rem; background: var(--bg, #1a1b26); border: 1px solid var(--border, #414868); border-radius: 4px; color: inherit; min-width: 220px; }
    tr.writ-row { cursor: pointer; }
    tr.writ-row:hover { opacity: 0.85; }
    /*
     * Depth-aware indentation. Each row stamps `data-depth` and the title
     * cell uses a CSS variable to scale its left padding — keeps the HTML
     * compact and the calculation in one place. Base padding (1rem) lines
     * up with the rest of the table; each level adds 1.25rem.
     */
    tr.writ-row .title-cell {
      padding-left: calc(0.75rem + var(--depth, 0) * 1.25rem);
    }
    tr.writ-row[data-depth] { /* attribute selector — depth read by CSS */ }
    /* Per-node expand/collapse toggle */
    .row-toggle {
      display: inline-block;
      width: 1rem;
      text-align: center;
      cursor: pointer;
      user-select: none;
      opacity: 0.6;
      margin-right: 0.25rem;
      font-family: monospace;
    }
    .row-toggle:hover { opacity: 1; }
    .row-toggle.row-toggle--placeholder { visibility: hidden; cursor: default; }
    /* Overflow row at the depth cap */
    tr.overflow-row { cursor: pointer; opacity: 0.55; font-style: italic; }
    tr.overflow-row:hover { opacity: 0.85; }
    tr.overflow-row .overflow-cell {
      padding-left: calc(0.75rem + var(--depth, 0) * 1.25rem);
    }
    #post-section { margin-bottom: 16px; display: none; }
    #post-section.open { display: block; }
    #post-section h3 { margin: 0 0 0.75rem; }
    .form-row { margin-bottom: 0.75rem; display: flex; flex-direction: column; gap: 0.3rem; }
    .form-row label { font-size: 0.875rem; opacity: 0.7; }
    .form-row input, .form-row textarea, .form-row select {
      padding: 0.4rem 0.6rem; background: var(--bg3, #24283b);
      border: 1px solid var(--border, #414868); border-radius: 4px;
      color: inherit; font-size: 0.9rem;
    }
    .form-row textarea { resize: vertical; font-family: monospace; }
    .th-sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    .th-sortable:hover { opacity: 0.8; }
    #load-more-row { text-align: center; padding: 0.75rem; }
    #search-input { padding: 0.35rem 0.6rem; background: var(--bg3, #24283b); border: 1px solid var(--border, #414868); border-radius: 4px; color: inherit; min-width: 180px; }
    .action-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  </style>
</head>
<body>
<main style="padding: 24px;">
  <h1>Writs</h1>

  <div id="writ-list-view">
  <!--
    URL-state validation banner. Surfaced when the page is loaded with a
    URL filter value that does not match any known classification, type,
    sort column, or sort direction (D6 fail-loud). Pages must not
    silently fall back to a default — the operator copy-pasting a URL
    needs honest feedback so they can recover.
  -->
  <div id="url-error-banner" class="error-msg" style="display:none;margin-bottom:12px;padding:0.6rem 0.8rem;background:var(--bg2,#1a1b26);border:1px solid var(--red,#f7768e);border-radius:6px;font-size:0.9rem;color:var(--red,#f7768e)"></div>
  <div class="card" style="margin-bottom: 16px;">
  <div class="toolbar" id="toolbar">
    <button class="btn btn--primary" id="btn-new-writ">New Writ</button>
    <button class="btn" id="btn-refresh">Refresh</button>
    <span style="display:inline-flex;gap:0.4rem;flex-wrap:wrap;align-items:center">
      <!--
        Classification filter buttons (D9). Type-agnostic by
        construction: `initial`/`active`/`terminal` map across every
        registered writ type's state catalogue. Replaces the legacy
        hardcoded mandate phase buttons (new/open/completed/failed/
        cancelled) so non-mandate types share the same filter bar.
      -->
      <span style="font-size:0.875rem;opacity:0.6">State:</span>
      <button class="btn filter-btn active-filter" data-classification="">All</button>
      <button class="btn filter-btn" data-classification="initial">initial</button>
      <button class="btn filter-btn" data-classification="active">active</button>
      <button class="btn filter-btn" data-classification="terminal">terminal</button>
    </span>
    <span id="type-filter-bar" style="display:inline-flex;gap:0.4rem;flex-wrap:wrap;align-items:center">
      <span style="font-size:0.875rem;opacity:0.6">Type:</span>
      <button class="btn filter-btn type-filter-btn active-filter" data-type="">All</button>
    </span>
    <input type="text" id="search-input" placeholder="Search title...">
    <!--
      Toggles share the State filter's `.btn filter-btn` markup so the
      existing `.filter-btn.active-filter` rule paints them the same way.
      Children defaults ON (children visible); Cancelled defaults OFF
      (cancelled writs hidden) — matching D4.
    -->
    <button class="btn filter-btn active-filter" id="btn-toggle-children">Children</button>
    <button class="btn filter-btn" id="btn-toggle-cancelled">Cancelled</button>
  </div>
  </div>

  <div id="post-section" class="card">
    <h3 id="post-title">New Writ</h3>
    <div class="form-row">
      <label for="post-title-input">Title</label>
      <input type="text" id="post-title-input" placeholder="Writ title" required>
    </div>
    <div class="form-row">
      <label for="post-body-input">Body</label>
      <textarea id="post-body-input" rows="8" placeholder="Detail text..." required></textarea>
    </div>
    <div class="form-row">
      <label for="post-type-select">Type</label>
      <select id="post-type-select"></select>
    </div>
    <div class="form-row">
      <label for="post-codex-select">Codex</label>
      <select id="post-codex-select" required>
        <option value="">Select a codex…</option>
      </select>
      <div id="post-codex-error" class="error-msg" style="display:none"></div>
    </div>
    <div class="form-row" style="flex-direction:row;align-items:center;gap:0.5rem">
      <input type="checkbox" id="post-draft-checkbox" style="width:auto;accent-color:var(--blue,#7aa2f7)">
      <label for="post-draft-checkbox" style="opacity:1;cursor:pointer">Draft — hold in <em>new</em> phase, do not enter queue yet</label>
    </div>
    <button class="btn btn--primary" id="post-submit-btn">Post Writ</button>
    <div id="post-error" class="error-msg" style="display:none"></div>
    <div id="post-warn" class="warn-msg" style="display:none"></div>
  </div>

  <div class="card" style="margin-bottom: 16px;">
  <table class="data-table" id="writ-table">
    <thead>
      <tr>
        <th class="th-sortable" data-col="phase">Phase <span class="sort-ind" data-col="phase"></span></th>
        <th class="th-sortable" data-col="title">Title <span class="sort-ind" data-col="title"></span></th>
        <th class="th-sortable" data-col="type">Type <span class="sort-ind" data-col="type"></span></th>
        <th class="th-sortable" data-col="id">ID <span class="sort-ind" data-col="id"></span></th>
        <th class="th-sortable" data-col="createdAt">Created <span class="sort-ind" data-col="createdAt"></span></th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="writ-tbody"></tbody>
  </table>
  </div>
  <div id="load-more-row" style="display:none; text-align: center; margin-top: 8px;">
    <button class="btn" id="load-more-btn">Load more</button>
  </div>
  </div>

  <div id="writ-detail-view" style="display:none">
    <button id="back-btn" class="btn">&#8592; Back to list</button>
    <h2 id="detail-title"></h2>
    <div id="detail-content"></div>
  </div>

  <datalist id="link-labels">
    <option value="retries"></option>
    <option value="supersedes"></option>
    <option value="fixes"></option>
    <option value="duplicates"></option>
    <option value="blocks"></option>
  </datalist>

</main>

  <script>
  (() => {
    // ── State ──────────────────────────────────────────────────────────
    // forest is the page's source of truth: a forest of WritTree nodes
    // returned by /api/writ/tree. Each node is { writ, children: WritTree[] }.
    let forest = [];
    let offset = 0;
    // Filter buttons in the toolbar are now keyed by classification (D9):
    // 'initial' | 'active' | 'terminal' | '' (All). The legacy
    // mandate-phase strings on these buttons are gone — vocabulary lives
    // entirely in the writ-type registry returned by /api/writ/types.
    let currentClassification = '';
    let currentType = new Set();  // Set<string> — empty = no types selected (empty state)
    let knownTypes = [];          // string[] — names of types currently declared (builtins + config + kits)
    /**
     * Catalogue of writ types keyed by name. Each entry is a `WritTypeInfo`
     * (T1 widened shape) carrying its full state catalogue: per-state
     * classification, attrs, and allowedTransitions. Sourced from
     * /api/writ/types at page load and consumed by the shared
     * `derivePresentation` helper below.
     */
    let writTypesByName = new Map();
    let searchText = '';
    let sortCol = 'createdAt';
    let sortDir = 'desc';
    let showChildren = true; // global Children toggle — children shown by default
    // Global Cancelled toggle — cancelled writs hidden by default (D4).
    // Layered in addition to State / Type / search filters; never short-
    // circuited when State=terminal (D2).
    let showCancelled = false;
    let collapsedSet = new Set(); // per-row collapse state, keyed by writ id
    let repostSourceId = null;
    let linkKinds = [];      // [{ id, ownerPlugin, description }] — registered writ link kinds

    // Page size constant — the number of root writs fetched per batch.
    // Bumped to 100 because the deep-descendant view brings more rows on
    // screen, and operators want more roots visible by default.
    const LIMIT = 100;
    // Maximum visible depth before the overflow row replaces further
    // descendants. The page fetches one level past the cap so it can detect
    // (and summarise) hidden subtrees without enumerating them.
    const DEPTH_CAP = 8;

    // ── URL handling ───────────────────────────────────────────────────
    //
    // All deep-linkable view state for this page rides on
    // `window.NexusUrl` — the shared helper auto-injected by oculus's
    // chrome pass. The earlier inline `currentUrlParams` / `updateUrl`
    // copies are gone (commission moix23w5).
    //
    // URL keys, all client-side except `?writ=`, `?classification=`,
    // and `?type=` which are also accepted by /api/writ/* endpoints:
    //   ?classification= one of '' | 'initial' | 'active' | 'terminal'.
    //                    Default '' (All); omitted when default (D4).
    //   ?type=A&type=B   Repeated keys (D3). Omitted when every known
    //                    type is selected (the default). Subset → emit
    //                    each currently-selected type. The empty-set
    //                    edge case collapses to default on round-trip
    //                    (operators don't share empty list states).
    //   ?q=              Search text. Omitted when empty.
    //   ?sort=           One of phase | title | type | id | createdAt.
    //                    Default 'createdAt'; omitted when default.
    //   ?dir=            'asc' | 'desc'. Default 'desc'; omitted when
    //                    default.
    //   ?children=       'true' | 'false' (D7). Default true; omitted
    //                    when default.
    //   ?cancelled=      'true' | 'false'. Default false; omitted when
    //                    default.
    //   ?writ=ID         Detail deep-link; opening pushes (D5).

    const SORT_COLS = new Set(['phase', 'title', 'type', 'id', 'createdAt']);
    const SORT_DIRS = new Set(['asc', 'desc']);
    const CLASSIFICATIONS = new Set(['', 'initial', 'active', 'terminal']);

    /** Append a fail-loud message to the URL-error banner (D6). */
    function showUrlError(msg) {
      const el = document.getElementById('url-error-banner');
      if (!el) return;
      // Append rather than replace so multiple invalid params each get
      // their own line — operators see every recovery hint at once.
      const line = document.createElement('div');
      line.textContent = msg;
      el.appendChild(line);
      el.style.display = 'block';
    }

    /** Clear the URL-error banner — used before a fresh validation pass. */
    function clearUrlErrors() {
      const el = document.getElementById('url-error-banner');
      if (!el) return;
      el.innerHTML = '';
      el.style.display = 'none';
    }

    /**
     * Apply current filter state to the URL via NexusUrl.update. Always
     * a replace (D5 default) — filter changes do not push history
     * entries. When a filter is at its declared default the
     * corresponding key is omitted (D4). Type[] is omitted when every
     * known type is selected (the operator-default).
     */
    function writeFiltersToUrl() {
      const allKnown = knownTypes.length > 0 && knownTypes.every(t => currentType.has(t));
      const noneSelected = currentType.size === 0;
      const typeArray = (allKnown || noneSelected) ? null : [...currentType];
      window.NexusUrl.update({
        classification: currentClassification === '' ? null : currentClassification,
        type: typeArray,
        q: searchText === '' ? null : searchText,
        sort: sortCol === 'createdAt' ? null : sortCol,
        dir: sortDir === 'desc' ? null : sortDir,
        children: showChildren === true ? null : false,
        cancelled: showCancelled === false ? null : true,
      });
    }

    /**
     * Read the URL filter state into module-level variables. Validates
     * each value against its known set and surfaces an error banner
     * for any unknown value (D6 fail-loud). Returns the writ id, if
     * any, so the caller can route into the detail view.
     *
     * Must be called after loadWritTypes() so knownTypes is populated
     * and the type[] validation can fire.
     */
    function readFiltersFromUrl() {
      clearUrlErrors();
      const params = window.NexusUrl.read();

      // ── classification ────────────────────────────────────────────
      const classification = params.get('classification');
      if (classification !== null) {
        if (CLASSIFICATIONS.has(classification)) {
          currentClassification = classification;
        } else {
          showUrlError(`Unknown classification "${classification}". Expected one of: initial, active, terminal.`);
        }
      }

      // ── type[] ─────────────────────────────────────────────────────
      const typeValues = params.getAll('type');
      if (typeValues.length > 0) {
        const knownSet = new Set(knownTypes);
        const unknown = typeValues.filter(t => !knownSet.has(t));
        if (unknown.length > 0) {
          for (const u of unknown) {
            showUrlError(`Unknown writ type "${u}". The current type registry does not declare this name.`);
          }
        } else {
          currentType = new Set(typeValues);
        }
      }
      // Otherwise leave currentType at its default (set by buildTypeFilterBar to all known types).

      // ── search text ────────────────────────────────────────────────
      const q = params.get('q');
      if (q !== null) searchText = q;

      // ── sort ───────────────────────────────────────────────────────
      const sort = params.get('sort');
      if (sort !== null) {
        if (SORT_COLS.has(sort)) {
          sortCol = sort;
        } else {
          showUrlError(`Unknown sort column "${sort}". Expected one of: ${[...SORT_COLS].join(', ')}.`);
        }
      }
      const dir = params.get('dir');
      if (dir !== null) {
        if (SORT_DIRS.has(dir)) {
          sortDir = dir;
        } else {
          showUrlError(`Unknown sort direction "${dir}". Expected "asc" or "desc".`);
        }
      }

      // ── boolean toggles ───────────────────────────────────────────
      const childrenRaw = params.get('children');
      if (childrenRaw !== null) {
        if (childrenRaw === 'true') showChildren = true;
        else if (childrenRaw === 'false') showChildren = false;
        else showUrlError(`Invalid children value "${childrenRaw}". Expected "true" or "false".`);
      }
      const cancelledRaw = params.get('cancelled');
      if (cancelledRaw !== null) {
        if (cancelledRaw === 'true') showCancelled = true;
        else if (cancelledRaw === 'false') showCancelled = false;
        else showUrlError(`Invalid cancelled value "${cancelledRaw}". Expected "true" or "false".`);
      }

      return params.get('writ');
    }

    /**
     * Sync the toolbar UI to current filter state. Called after URL
     * restore (init / popstate) so visible button fills, the search
     * input, and the type-filter bar match what the URL describes.
     */
    function syncFilterUiFromState() {
      // Classification buttons
      document.querySelectorAll('.filter-btn[data-classification]').forEach(btn => {
        btn.classList.toggle('active-filter', btn.dataset.classification === currentClassification);
      });

      // Type-filter pills
      const bar = document.getElementById('type-filter-bar');
      if (bar) {
        const allBtn = bar.querySelector('.type-filter-btn[data-type=""]');
        const typeBtns = [...bar.querySelectorAll('.type-filter-btn:not([data-type=""])')];
        const allTypeNames = typeBtns.map(b => b.dataset.type);
        const allActive = allTypeNames.length > 0 && allTypeNames.every(t => currentType.has(t));
        if (allBtn) allBtn.classList.toggle('active-filter', allActive);
        typeBtns.forEach(btn => {
          btn.classList.toggle('active-filter', currentType.has(btn.dataset.type));
        });
      }

      // Search input
      const searchInput = document.getElementById('search-input');
      if (searchInput && searchInput.value !== searchText) searchInput.value = searchText;

      // Toggles
      const childrenBtn = document.getElementById('btn-toggle-children');
      if (childrenBtn) childrenBtn.classList.toggle('active-filter', showChildren);
      const cancelledBtn = document.getElementById('btn-toggle-cancelled');
      if (cancelledBtn) cancelledBtn.classList.toggle('active-filter', showCancelled);
    }

    // ── Helpers ────────────────────────────────────────────────────────

    async function api(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error ?? `HTTP ${res.status}`);
      return json;
    }

    /**
     * Single-source-of-truth presentation derivation for any writ.
     *
     * Inputs:
     *   - `type`: the writ's type name (looked up against `writTypesByName`).
     *   - `phase`: the writ's current state name.
     *
     * Returns:
     *   { classification, attrs, badgeClass, indicator,
     *     allowedTransitions, isTerminal }
     *
     * Mirrors the server-side `deriveStateIndicator` in
     * packages/plugins/clerk/src/writ-presentation.ts so the two surfaces
     * stay byte-faithful: mandate's six states recover their pre-T5
     * glyphs and badge classes, and any plugin-contributed type using
     * the four well-known attrs (`success`, `failure`, `cancelled`,
     * `stuck`) inherits the same vocabulary for free. Unknown
     * classifications surface as `?` / `badge` (no class suffix) per
     * D17, so a single legacy writ does not abort rendering.
     */
    function derivePresentation(type, phase) {
      const typeInfo = writTypesByName.get(type);
      const state = typeInfo
        ? typeInfo.states.find((s) => s.name === phase)
        : undefined;

      if (!state) {
        return {
          classification: 'unknown',
          attrs: [],
          badgeClass: '',
          indicator: '?',
          allowedTransitions: [],
          isTerminal: false,
        };
      }

      const classification = state.classification;
      const attrs = state.attrs ?? [];
      const has = (a) => attrs.includes(a);

      let badgeClass = '';
      let indicator = '';
      if (classification === 'initial') {
        indicator = '◌'; badgeClass = 'badge--draft';
      } else if (classification === 'active') {
        if (has('stuck')) { indicator = '◇'; badgeClass = 'badge--warning'; }
        else { indicator = '●'; badgeClass = 'badge--active'; }
      } else if (classification === 'terminal') {
        if (has('success')) { indicator = '○'; badgeClass = 'badge--success'; }
        else if (has('failure')) { indicator = '✕'; badgeClass = 'badge--error'; }
        else if (has('cancelled')) { indicator = '⊘'; badgeClass = 'badge--warning'; }
        else { indicator = '○'; badgeClass = ''; }
      }

      return {
        classification,
        attrs,
        badgeClass,
        indicator,
        allowedTransitions: state.allowedTransitions ?? [],
        isTerminal: classification === 'terminal',
      };
    }

    /**
     * Render the badge HTML for a writ. Reads vocabulary from the shared
     * derivation helper — there are no mandate phase string literals in
     * this function. The state name is whatever the writ's type config
     * declares, so plugin-contributed types render with their own labels
     * for free.
     */
    function phaseBadge(phaseOrWrit, typeArg) {
      // Backward-compatible invocation: phaseBadge('open') still works
      // (no type → fallback to mandate vocabulary lookup). Prefer
      // phaseBadge(writ) so the helper can pick up the writ's actual
      // type vocabulary.
      let type;
      let phase;
      if (typeof phaseOrWrit === 'string') {
        phase = phaseOrWrit;
        type = typeArg ?? 'mandate';
      } else if (phaseOrWrit && typeof phaseOrWrit === 'object') {
        type = phaseOrWrit.type ?? 'mandate';
        phase = phaseOrWrit.phase ?? '';
      } else {
        type = 'mandate';
        phase = '';
      }
      const { badgeClass } = derivePresentation(type, phase);
      const cls = badgeClass ? `badge ${badgeClass}` : 'badge';
      return `<span class="${cls}">${phase}</span>`;
    }

    function fmtDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleString();
    }

    function compareVal(a, b, col) {
      const av = a[col] ?? '';
      const bv = b[col] ?? '';
      if (av < bv) return -1;
      if (av > bv) return 1;
      return 0;
    }

    // ── Forest helpers ─────────────────────────────────────────────────

    /** Locate a writ tree node by id, recursively. Returns null when absent. */
    function findInForest(nodes, id) {
      for (const node of nodes) {
        if (node.writ.id === id) return node;
        const child = findInForest(node.children ?? [], id);
        if (child) return child;
      }
      return null;
    }

    /**
     * Replace the WritDoc at `id` with `newWrit` (mutates in place). Used by
     * action handlers that want to refresh a single row's underlying doc
     * without re-issuing the tree fetch.
     */
    function replaceWritInForest(nodes, id, newWrit) {
      for (const node of nodes) {
        if (node.writ.id === id) {
          node.writ = newWrit;
          return true;
        }
        if (replaceWritInForest(node.children ?? [], id, newWrit)) return true;
      }
      return false;
    }

    /**
     * Prune a tree by title match. Matched node keeps its entire subtree;
     * non-matching node is kept only when at least one descendant matches
     * (preserves the ancestor chain of every match). Returns null when
     * nothing in the subtree matches.
     */
    function pruneByTitleMatch(node, q) {
      const writ = node.writ;
      const selfMatches = (writ.title ?? '').toLowerCase().includes(q);
      if (selfMatches) {
        return { writ, children: node.children ?? [] };
      }
      const prunedChildren = (node.children ?? [])
        .map(c => pruneByTitleMatch(c, q))
        .filter(Boolean);
      if (prunedChildren.length > 0) {
        return { writ, children: prunedChildren };
      }
      return null;
    }

    /**
     * Drop nodes whose state attrs include `cancelled` (and their entire
     * subtrees). Type-agnostic: `attrs` come from the page's
     * `derivePresentation` helper, so any plugin-contributed type whose
     * cancelled state declares the `cancelled` attr is hidden too.
     *
     * Mirrors Ratchet's `pruneByStatus` shape (D1) — a non-matching node is
     * dropped together with everything beneath it. Returns null when this
     * subtree should disappear entirely; otherwise returns a fresh node
     * with pruned children.
     */
    function pruneByCancelled(node) {
      const writ = node.writ;
      const present = derivePresentation(writ.type, writ.phase);
      if (present.attrs.includes('cancelled')) return null;
      const prunedChildren = (node.children ?? [])
        .map(pruneByCancelled)
        .filter(Boolean);
      return { writ, children: prunedChildren };
    }

    /**
     * Flatten the current forest into rows annotated with depth, respecting
     * the global Children toggle, per-node collapse state, ancestor-preserve
     * title search, and the depth cap (with an overflow marker beyond it).
     *
     * Each row is one of:
     *   { kind: 'writ', writ, depth, hasChildren, isCollapsed }
     *   { kind: 'overflow', depth, ancestorId }  // ancestorId = deepest visible parent
     *
     * The sort column applies to roots only — descendants stay in the order
     * the server returned them (createdAt asc within each parent), so the
     * shape of the tree stays stable when the operator changes columns.
     */
    function sortedFilteredWrits() {
      // Cancelled prune layers in addition to the State / Type / search
      // pipeline (D2). Applied first so a cancelled root's title-search
      // descendants don't accidentally surface their hidden ancestor.
      const cancelledFiltered = showCancelled
        ? forest
        : forest.map(pruneByCancelled).filter(Boolean);

      const q = searchText.toLowerCase();
      const pruned = q
        ? cancelledFiltered.map(t => pruneByTitleMatch(t, q)).filter(Boolean)
        : cancelledFiltered;

      const sortedRoots = [...pruned].sort((a, b) => {
        const cmp = compareVal(a.writ, b.writ, sortCol);
        return sortDir === 'asc' ? cmp : -cmp;
      });

      const out = [];
      for (const node of sortedRoots) emit(node, 0);
      return out;

      function emit(node, depth) {
        const writ = node.writ;
        const hasChildren = (node.children ?? []).length > 0;
        const isCollapsed = collapsedSet.has(writ.id);
        out.push({ kind: 'writ', writ, depth, hasChildren, isCollapsed });

        if (!showChildren) return;
        if (depth >= DEPTH_CAP) {
          if (hasChildren) {
            out.push({ kind: 'overflow', depth: depth + 1, ancestorId: writ.id });
          }
          return;
        }
        if (isCollapsed) return;
        for (const child of node.children ?? []) emit(child, depth + 1);
      }
    }

    function showError(el, msg) {
      el.textContent = msg;
      el.style.display = 'block';
    }

    function clearError(el) {
      el.textContent = '';
      el.style.display = 'none';
    }

    // ── Descendant tree helpers ────────────────────────────────────────

    /**
     * WritTree node shape: { writ: WritDoc, children: WritTreeNode[] }.
     *
     * Recursively fetches descendants of `rootId` via /api/writ/list, producing a
     * tree of `WritTreeNode` entries. Guards against cycles with `visited` and
     * bounds recursion at `maxDepth` (default 10) to keep the UI responsive on
     * pathological data. Children at each level are sorted by createdAt ascending
     * (oldest first).
     *
     * Returns `WritTreeNode[]` — the direct children of `rootId`, each with their
     * own nested `children` list.
     */
    async function buildDescendantTree(rootId, maxDepth = 10, visited = null) {
      if (visited === null) visited = new Set();
      if (maxDepth <= 0) return [];
      if (visited.has(rootId)) return [];
      visited.add(rootId);

      let children;
      try {
        children = await api('GET',
          '/api/writ/list?parentId=' + encodeURIComponent(rootId) + '&limit=1000&format=json');
      } catch (e) {
        console.error('Failed to fetch children for ' + rootId, e);
        return [];
      }

      children.sort((a, b) => (a.createdAt ?? '').localeCompare(b.createdAt ?? ''));

      // Fetch grandchildren in parallel for each child
      const nodes = await Promise.all(children.map(async (child) => {
        const subChildren = await buildDescendantTree(child.id, maxDepth - 1, visited);
        return { writ: child, children: subChildren };
      }));
      return nodes;
    }

    /**
     * Flattens a WritTree forest into a depth-first list of `{ writ, depth }`.
     * `depth` is 0-based — direct children of the root get depth 0, their
     * children get depth 1, etc. Order preserves the pre-order traversal
     * of the tree (parent before children, children in createdAt order).
     */
    function flattenTree(nodes, depth = 0, acc = null) {
      if (acc === null) acc = [];
      for (const node of nodes) {
        acc.push({ writ: node.writ, depth });
        if (node.children && node.children.length > 0) {
          flattenTree(node.children, depth + 1, acc);
        }
      }
      return acc;
    }

    /**
     * Returns inline style for indenting a depth-aware row's title cell.
     * Depth 0 is the first indent step, matching the existing child-row
     * padding-left: 2rem in the main list; each additional depth adds
     * 1.5rem so nested descendants are visually distinguishable.
     */
    function depthIndentStyle(depth) {
      const rem = 2 + depth * 1.5;
      return `padding-left:${rem}rem`;
    }

    // ── Row actions ────────────────────────────────────────────────────

    /**
     * Returns the HTML for the context-aware Actions cell for a writ row.
     *
     * Walks the writ's allowedTransitions (from the shared derivation
     * helper) and emits one button per legal transition. Labels and
     * classes are derived from the destination state's attrs per D10:
     *   - destination state name `open` and source state is initial
     *     → "Start" (mandate's special case for publish-from-draft).
     *   - destination attrs include `cancelled` → "Cancel" / btn--danger.
     *   - destination attrs include `success`   → "Complete" / btn--success.
     *   - destination attrs include `failure`   → "Fail" / btn--danger.
     *   - otherwise the destination state name verbatim, plain btn.
     *
     * Terminal writs receive no buttons. Cancel is the only row-level
     * cancel surfaced here (the existing mandate UX); other transitions
     * (Complete / Fail) live on the detail view because they require a
     * resolution.
     */
    function rowActions(w) {
      const present = derivePresentation(w.type, w.phase);
      if (present.isTerminal) return '';

      const fromTypeInfo = writTypesByName.get(w.type);
      const fromState = fromTypeInfo
        ? fromTypeInfo.states.find((s) => s.name === w.phase)
        : undefined;
      const fromClassification = fromState?.classification;

      const btns = [];
      for (const dest of present.allowedTransitions) {
        const destState = fromTypeInfo
          ? fromTypeInfo.states.find((s) => s.name === dest)
          : undefined;
        if (!destState) continue;
        const destAttrs = destState.attrs ?? [];
        // Initial→active publish — mandate's "Start" affordance.
        if (fromClassification === 'initial' && dest === 'open') {
          btns.push(`<button class="btn btn--primary row-action-btn" style="padding:0.15rem 0.5rem;font-size:0.8rem" data-action="row-publish" data-id="${w.id}">Start</button>`);
          continue;
        }
        // Cancellation row affordance — emitted at the row level for any
        // transition that lands in a `cancelled` terminal state. Matches
        // the existing mandate UX (Cancel from new/open/stuck is row-
        // accessible; Complete and Fail live in the detail view because
        // they require a resolution input).
        if (destAttrs.includes('cancelled')) {
          btns.push(`<button class="btn btn--danger row-action-btn" style="padding:0.15rem 0.5rem;font-size:0.8rem" data-action="row-cancel" data-id="${w.id}">Cancel</button>`);
          continue;
        }
        // Success/failure transitions are detail-view only.
      }
      return btns.join(' ');
    }

    async function handleRowAction(action, id, btn) {
      const orig = btn.textContent;
      btn.disabled = true;
      try {
        if (action === 'row-publish') {
          btn.textContent = '…';
          await api('POST', '/api/writ/publish', { id });
        } else if (action === 'row-cancel') {
          btn.textContent = '…';
          await api('POST', '/api/writ/cancel', { id });
        }
        // Reload this writ and update the row
        const writ = await api('GET', `/api/writ/show?id=${encodeURIComponent(id)}`);
        replaceWritInForest(forest, id, writ);
        updateRowPhase(id);
        updateRowActions(id);
        // Refresh detail view if open
        if (document.getElementById('writ-detail-view').style.display !== 'none') {
          await refreshDetail(id);
        }
      } catch (e) {
        alert(`Action failed: ${e.message}`);
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    function updateRowActions(id) {
      const node = findInForest(forest, id);
      const writ = node?.writ;
      if (!writ) return;
      const row = document.querySelector(`tr.writ-row[data-id="${id}"]`);
      if (!row) return;
      const cells = row.querySelectorAll('td');
      const actionsCell = cells[5];
      if (!actionsCell) return;
      actionsCell.innerHTML = rowActions(writ);
      actionsCell.querySelectorAll('.row-action-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          handleRowAction(btn.dataset.action, btn.dataset.id, btn);
        });
      });
    }

    // ── Render ─────────────────────────────────────────────────────────

    /**
     * Pure empty-state message chooser — invoked from renderTable's empty
     * branch. When the operator has deselected every type filter, name both
     * the cause and the remedy; for every other empty case (empty backend
     * result, phase filter with no hits, search text with no matches) fall
     * back to the generic "No writs found." message. `forestIsEmpty`
     * documents the caller's precondition (this helper is only meaningful
     * when the table is actually empty) but does not change the decision —
     * the type-deselected branch always wins when it applies, because that
     * is the only case where loadWrits short-circuits the network fetch.
     */
    function chooseEmptyStateMessage(noTypesSelected, forestIsEmpty) {
      if (noTypesSelected) {
        return 'All types deselected — select at least one type to see writs';
      }
      return 'No writs found.';
    }

    function renderTable() {
      const tbody = document.getElementById('writ-tbody');
      const visible = sortedFilteredWrits();

      if (visible.length === 0 && forest.length === 0) {
        const message = chooseEmptyStateMessage(currentType.size === 0, forest.length === 0);
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">${message}</div></td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      for (const row of visible) {
        if (row.kind === 'overflow') {
          // Single muted child row indicating the depth cap was reached.
          // Clicking it opens the detail view for the deepest visible
          // ancestor so the operator can drill into the hidden subtree.
          const tr = document.createElement('tr');
          tr.className = 'overflow-row';
          tr.dataset.ancestorId = row.ancestorId;
          tr.style.setProperty('--depth', row.depth);
          tr.innerHTML =
            '<td></td>' +
            '<td class="overflow-cell" colspan="5">… more descendants below — click to open detail</td>';
          tr.addEventListener('click', () => showWritDetail(row.ancestorId));
          tbody.appendChild(tr);
          continue;
        }

        const w = row.writ;
        const tr = document.createElement('tr');
        tr.className = 'writ-row' + (row.depth > 0 ? ' child-row' : '');
        tr.dataset.id = w.id;
        tr.dataset.depth = String(row.depth);
        // CSS variable drives the title-cell padding.
        tr.style.setProperty('--depth', row.depth);

        // Per-node expand/collapse affordance — only renders a real toggle
        // on rows with children; otherwise a placeholder keeps the title
        // column aligned across the table.
        const hasChildren = row.hasChildren;
        const isCollapsed = row.isCollapsed;
        const toggleHtml = hasChildren
          ? `<span class="row-toggle" data-toggle-id="${w.id}" title="${isCollapsed ? 'Expand' : 'Collapse'}">${isCollapsed ? '▸' : '▾'}</span>`
          : `<span class="row-toggle row-toggle--placeholder">·</span>`;

        tr.innerHTML =
          '<td>' + phaseBadge(w) + '</td>' +
          '<td class="title-cell">' + toggleHtml + escHtml(w.title ?? '') + '</td>' +
          '<td>' + (w.type ?? '') + '</td>' +
          '<td class="id-cell"><code>' + w.id + '</code> <button class="btn copy-id-btn" data-copy-id="' + w.id + '" style="padding:0.1rem 0.3rem;font-size:0.7rem;cursor:pointer">📋</button></td>' +
          '<td>' + (row.depth > 0 ? '' : fmtDate(w.createdAt)) + '</td>' +
          '<td class="row-actions" style="white-space:nowrap">' + rowActions(w) + '</td>';

        // Wire row-action buttons (stop row-click propagation)
        tr.querySelectorAll('.row-action-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            handleRowAction(btn.dataset.action, btn.dataset.id, btn);
          });
        });
        // Stop propagation on the ID cell so clicking text or copy button doesn't open detail
        const idCell = tr.querySelector('.id-cell');
        if (idCell) {
          idCell.addEventListener('click', e => e.stopPropagation());
        }
        // Wire the per-row collapse toggle.
        const toggleEl = tr.querySelector('.row-toggle:not(.row-toggle--placeholder)');
        if (toggleEl) {
          toggleEl.addEventListener('click', e => {
            e.stopPropagation();
            toggleNodeCollapse(toggleEl.dataset.toggleId);
          });
        }
        // Wire copy button in ID cell
        const copyBtn = tr.querySelector('.copy-id-btn');
        if (copyBtn) {
          copyBtn.addEventListener('click', () => {
            copyToClipboard(copyBtn.dataset.copyId, copyBtn);
          });
        }
        // Click row -> show detail view
        tr.addEventListener('click', () => showWritDetail(w.id));
        tbody.appendChild(tr);
      }

      updateSortIndicators();
    }

    /** Flip a row's collapse state and re-render. */
    function toggleNodeCollapse(id) {
      if (collapsedSet.has(id)) collapsedSet.delete(id);
      else collapsedSet.add(id);
      renderTable();
    }

    async function copyToClipboard(text, feedbackEl) {
      try {
        await navigator.clipboard.writeText(text);
        const original = feedbackEl.textContent;
        feedbackEl.textContent = '✓';
        setTimeout(() => { feedbackEl.textContent = original; }, 1500);
      } catch (e) {
        console.error('Copy failed:', e);
      }
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escAttr(s) {
      return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function updateSortIndicators() {
      document.querySelectorAll('.sort-ind').forEach(el => {
        const col = el.dataset.col;
        el.textContent = col === sortCol ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
      });
    }

    // ── Detail row ─────────────────────────────────────────────────────

    function renderDetail(writ) {
      // Vocabulary derivation for this writ — single helper feeds the
      // edit-form gating ("draft" surfaces only on initial writs), the
      // action-buttons block (one per legal transition), and the Repost
      // affordance (terminal + failure/cancelled). No mandate phase
      // literals appear below.
      const present = derivePresentation(writ.type, writ.phase);
      const isTerminal = present.isTerminal;
      const isDraft = present.classification === 'initial';
      let html = '';

      // Edit form — title and body are always editable; type and codex only for drafts
      html += `<div class="detail-section" id="edit-section-${writ.id}">`;
      html += `<h4>${isDraft ? 'Edit Draft' : 'Edit'}</h4>`;
      html += `<div class="form-row"><label>Title</label>`;
      html += `<input type="text" id="edit-title-${writ.id}" value="${escAttr(writ.title ?? '')}" style="padding:0.4rem 0.6rem;background:var(--bg3,#24283b);border:1px solid var(--border,#414868);border-radius:4px;color:inherit;font-size:0.9rem"></div>`;
      html += `<div class="form-row"><label>Body</label>`;
      html += `<textarea id="edit-body-${writ.id}" rows="8" style="padding:0.4rem 0.6rem;background:var(--bg3,#24283b);border:1px solid var(--border,#414868);border-radius:4px;color:inherit;font-size:0.9rem;resize:vertical;font-family:monospace">${escHtml(writ.body ?? '')}</textarea></div>`;
      if (isDraft) {
        html += `<div class="form-row"><label>Type</label>`;
        html += `<select id="edit-type-${writ.id}" style="padding:0.4rem 0.6rem;background:var(--bg3,#24283b);border:1px solid var(--border,#414868);border-radius:4px;color:inherit;font-size:0.9rem"></select></div>`;
        html += `<div class="form-row"><label>Codex</label>`;
        html += `<select id="edit-codex-${writ.id}" style="padding:0.4rem 0.6rem;background:var(--bg3,#24283b);border:1px solid var(--border,#414868);border-radius:4px;color:inherit;font-size:0.9rem"></select></div>`;
      }
      html += `<div class="action-buttons">`;
      html += `<button class="btn btn--primary" data-action="save-edit" data-id="${writ.id}">Save</button>`;
      html += `<div class="error-msg" id="edit-error-${writ.id}" style="display:none"></div>`;
      html += `<div class="warn-msg" id="edit-success-${writ.id}" style="display:none;color:var(--green,#9ece6a)"></div>`;
      html += `</div></div>`;

      // Timestamps + metadata
      html += `<div class="detail-section"><h4>Details</h4><dl class="detail-grid">`;
      if (writ.codex) html += `<dt>Codex</dt><dd>${escHtml(writ.codex)}</dd>`;
      if (writ.parent) {
        // The href stays as `?writ=ID` so right-click → "Open in new tab"
        // and the on-hover URL preview keep working. wireDetailEvents
        // intercepts left-clicks below and routes through showWritDetail
        // so left-click stays an in-page navigation.
        html += `<dt>Parent</dt><dd><a class="parent-link" data-parent-id="${escAttr(writ.parent.id)}" href="?writ=${encodeURIComponent(writ.parent.id)}" style="color:var(--blue,#7aa2f7);text-decoration:underline;cursor:pointer">${escHtml(writ.parent.title)}</a> ${phaseBadge(writ.parent)}</dd>`;
      }
      html += `<dt>Created</dt><dd>${fmtDate(writ.createdAt)}</dd>`;
      html += `<dt>Updated</dt><dd>${fmtDate(writ.updatedAt)}</dd>`;
      if (writ.resolvedAt) html += `<dt>Resolved</dt><dd>${fmtDate(writ.resolvedAt)}</dd>`;
      if (writ.resolution) html += `<dt>Resolution</dt><dd>${escHtml(writ.resolution)}</dd>`;
      html += `</dl></div>`;

      // Transition actions — one button per legal transition, with
      // labels and CSS classes derived from the destination state's
      // attrs per D10. The vocabulary table:
      //   - `open` (publish from initial) → "Publish" / btn--primary
      //   - destination attrs include `success` → "Complete" / btn--success
      //   - destination attrs include `failure` → "Fail" / btn--danger
      //   - destination attrs include `cancelled` → "Cancel" / btn--danger
      //   - otherwise the destination state name verbatim / plain btn.
      // Mandate's existing label set (Publish, Complete, Fail, Cancel)
      // is preserved exactly because mandate's attrs match this table
      // byte-for-byte.
      if (!isTerminal) {
        html += `<div class="detail-section action-buttons" id="actions-${writ.id}">`;
        const fromTypeInfo = writTypesByName.get(writ.type);
        const fromClassification = present.classification;
        for (const dest of present.allowedTransitions) {
          const destState = fromTypeInfo
            ? fromTypeInfo.states.find((s) => s.name === dest)
            : undefined;
          if (!destState) continue;
          const destAttrs = destState.attrs ?? [];

          let label;
          let cssClass;
          let action;
          // D10 publish-from-initial special case: render mandate's
          // "Publish" affordance whenever the source is initial and the
          // destination is named `open`. (Plugin types that mirror
          // mandate's `new → open` shape inherit the label for free.)
          if (fromClassification === 'initial' && dest === 'open') {
            label = 'Publish';
            cssClass = 'btn--primary';
            action = 'publish';
          } else if (destAttrs.includes('success')) {
            label = 'Complete';
            cssClass = 'btn--success';
            action = 'complete';
          } else if (destAttrs.includes('failure')) {
            label = 'Fail';
            cssClass = 'btn--danger';
            action = 'fail';
          } else if (destAttrs.includes('cancelled')) {
            label = 'Cancel';
            cssClass = 'btn--danger';
            action = 'cancel';
          } else {
            label = dest;
            cssClass = '';
            action = 'transition';
          }
          const dataAttrs = action === 'transition'
            ? `data-action="transition" data-id="${writ.id}" data-target="${dest}"`
            : `data-action="${action}" data-id="${writ.id}"`;
          html += `<button class="btn ${cssClass}" ${dataAttrs}>${label}</button>`;
        }
        html += `<div class="error-msg" id="action-error-${writ.id}" style="display:none"></div>`;
        html += `<div id="confirm-area-${writ.id}"></div>`;
        html += `</div>`;
      }

      // Repost — D15: surface for any terminal writ whose state attrs
      // include `failure` or `cancelled`. Recovers mandate's existing UX
      // (Repost on `failed` and `cancelled`; not on `completed`); plugin
      // types using the same attrs inherit the affordance.
      if (
        present.isTerminal &&
        (present.attrs.includes('failure') || present.attrs.includes('cancelled'))
      ) {
        html += `<div class="detail-section"><button class="btn" data-action="repost" data-id="${writ.id}">Repost</button></div>`;
      }

      // Links
      html += `<div class="detail-section" id="links-section-${writ.id}">`;
      html += renderLinksSection(writ);
      html += `</div>`;

      // Children — deep descendant rendering
      //
      // Prefer the descendant tree populated by showWritDetail / refreshDetail
      // (writ._descendantTree: WritTreeNode[]). If the tree hasn't been populated
      // yet (older code path or fetch failure), fall back to the flat children
      // list shape so we still render something. The summary-badges block is
      // driven by writ.children.summary, which writ-show now populates with
      // subtree-wide (descendant) phase counts — grandchildren and deeper
      // contribute, matching the depth of the descendant table rendered below.
      let rows;
      if (writ._descendantTree && writ._descendantTree.length > 0) {
        rows = flattenTree(writ._descendantTree);
      } else {
        const childItems = writ._fullChildren ?? writ.children?.items ?? [];
        rows = childItems.map(c => ({ writ: c, depth: 0 }));
      }

      if (rows.length > 0) {
        html += `<div class="detail-section">`;
        html += `<h4>Children</h4>`;

        // Summary badges — phase counts span the entire descendant subtree
        // (the writ itself is excluded). The preceding label makes the scope
        // of the tallies visible at a glance without reading the tool docs.
        if (writ.children?.summary) {
          html += `<div class="detail-label" style="margin-bottom:0.25rem;font-size:0.85rem;color:var(--muted,#9aa5ce)">Descendants</div>`;
          html += `<div style="margin-bottom:0.5rem">`;
          for (const [phase, count] of Object.entries(writ.children.summary)) {
            // Descendant phase summary spans every child type. We don't
            // have per-row type context here, so we render the badge
            // anchored to the parent's type — which is the most
            // informative anchor available. Plugin-typed children of a
            // mandate parent will badge as their phase name with a
            // mandate-vocabulary fallback; a future enhancement could
            // group counts by (type, phase) pairs.
            html += phaseBadge(phase, writ.type) + ` <span style="margin-right:0.75rem">${count}</span>`;
          }
          html += `</div>`;
        }

        // Children table: Phase, Title, Type, ID, Actions — rows indent by depth.
        html += `<table class="data-table"><thead><tr>`;
        html += `<th>Phase</th><th>Title</th><th>Type</th><th>ID</th><th>Actions</th>`;
        html += `</tr></thead><tbody>`;
        for (const { writ: child, depth } of rows) {
          html += `<tr class="writ-row child-detail-row" data-child-id="${child.id}" data-depth="${depth}" style="cursor:pointer">`;
          html += `<td>${phaseBadge(child)}</td>`;
          html += `<td style="${depthIndentStyle(depth)}">${escHtml(child.title ?? '')}</td>`;
          html += `<td>${escHtml(child.type ?? '')}</td>`;
          html += `<td><code>${child.id}</code></td>`;
          html += `<td class="row-actions" style="white-space:nowrap">${rowActions(child)}</td>`;
          html += `</tr>`;
        }
        html += `</tbody></table></div>`;
      }

      return html;
    }

    function renderLinksSection(writ) {
      const outbound = (writ.links?.outbound ?? []);
      const inbound = (writ.links?.inbound ?? []);
      let html = `<h4>Links</h4>`;

      if (outbound.length === 0 && inbound.length === 0) {
        html += `<p style="font-size:0.875rem;opacity:0.5">No links.</p>`;
      }

      for (const l of outbound) {
        html += `<div class="link-row">
          <span class="link-dir">→</span>
          <a class="link-id" data-writ-id="${l.targetId}">${l.targetId}</a>
          <span>(${escHtml(l.label)})</span>
          <button class="btn btn--danger" style="padding:0.1rem 0.5rem;font-size:0.75rem"
            data-action="unlink" data-source="${l.sourceId}" data-target="${l.targetId}" data-label="${l.label}">×</button>
        </div>`;
      }
      for (const l of inbound) {
        html += `<div class="link-row">
          <span class="link-dir">←</span>
          <a class="link-id" data-writ-id="${l.sourceId}">${l.sourceId}</a>
          <span>(${escHtml(l.label)})</span>
          <button class="btn btn--danger" style="padding:0.1rem 0.5rem;font-size:0.75rem"
            data-action="unlink" data-source="${l.sourceId}" data-target="${l.targetId}" data-label="${l.label}">×</button>
        </div>`;
      }

      // Add link form — layout: [target] [kind▼] [label] [Link]
      let kindOptionsHtml = '<option value="">None</option>';
      for (const k of linkKinds) {
        const title = k.description ? ` title="${escHtml(k.description)}"` : '';
        kindOptionsHtml += `<option value="${escHtml(k.id)}"${title}>${escHtml(k.id)}</option>`;
      }
      html += `<div class="add-link-form" id="add-link-form-${writ.id}">
        <input type="text" id="link-target-${writ.id}" placeholder="Target writ id" style="width:140px">
        <select id="link-kind-${writ.id}" style="width:140px">${kindOptionsHtml}</select>
        <input type="text" id="link-label-${writ.id}" list="link-labels" placeholder="Link label" style="width:120px">
        <button class="btn" data-action="addlink" data-id="${writ.id}">Link</button>
        <div class="error-msg" id="link-error-${writ.id}" style="display:none"></div>
      </div>`;

      return html;
    }

    function wireDetailEvents(container, writ) {
      // Populate edit dropdowns for draft writs (initial classification).
      // The mandate-phase literal `'new'` is no longer the gate — any
      // writ whose current state is initial-classified is editable on
      // type/codex.
      const present = derivePresentation(writ.type, writ.phase);
      if (present.classification === 'initial') {
        populateEditDropdowns(writ);
      }

      // Transition action buttons + other data-action buttons
      container.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          handleDetailAction(action, id, btn, container, writ);
        });
      });

      // Link-id clicks (links section)
      container.querySelectorAll('.link-id[data-writ-id]').forEach(a => {
        a.addEventListener('click', e => {
          e.stopPropagation();
          e.preventDefault();
          showWritDetail(a.dataset.writId);
        });
      });

      // Parent link clicks — intercept the left-click so navigation
      // stays in-page and the URL push routes through the central
      // showWritDetail. The href is left intact so middle-click /
      // right-click → open-in-new-tab still work.
      container.querySelectorAll('.parent-link[data-parent-id]').forEach(a => {
        a.addEventListener('click', e => {
          // Honour modifier-key shortcuts so power users keep their
          // open-in-new-tab muscle memory.
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
          e.stopPropagation();
          e.preventDefault();
          showWritDetail(a.dataset.parentId);
        });
      });

      // Child row clicks — navigate to child detail
      container.querySelectorAll('.child-detail-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('.row-action-btn')) return;
          showWritDetail(row.dataset.childId);
        });
      });

      // Wire row-action buttons inside children table
      container.querySelectorAll('.child-detail-row .row-action-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          handleRowAction(btn.dataset.action, btn.dataset.id, btn);
        });
      });
    }

    async function populateEditDropdowns(writ) {
      // Populate type dropdown
      const typeSel = document.getElementById(`edit-type-${writ.id}`);
      if (typeSel) {
        try {
          const types = await api('GET', '/api/writ/types');
          typeSel.innerHTML = '';
          for (const t of types) {
            const opt = document.createElement('option');
            opt.value = t.name;
            opt.textContent = t.name;
            if (t.description) opt.title = t.description;
            if (t.name === writ.type) opt.selected = true;
            typeSel.appendChild(opt);
          }
        } catch (e) {
          typeSel.innerHTML = `<option value="${escAttr(writ.type ?? '')}">${escHtml(writ.type ?? '')}</option>`;
        }
      }

      // Populate codex dropdown
      const codexSel = document.getElementById(`edit-codex-${writ.id}`);
      if (codexSel) {
        try {
          const codexes = await api('GET', '/api/codex/list');
          codexSel.innerHTML = '<option value="">(none)</option>';
          for (const c of codexes) {
            const opt = document.createElement('option');
            opt.value = c.name;
            opt.textContent = c.name;
            if (c.name === writ.codex) opt.selected = true;
            codexSel.appendChild(opt);
          }
        } catch (e) {
          codexSel.innerHTML = `<option value="">(none)</option>`;
          if (writ.codex) {
            codexSel.innerHTML += `<option value="${escAttr(writ.codex)}" selected>${escHtml(writ.codex)}</option>`;
          }
        }
      }
    }

    function handleDetailAction(action, id, btn, td, writ) {
      if (action === 'save-edit') {
        doSaveEdit(id, btn, td);
      } else if (action === 'publish') {
        doPublish(id, btn, td);
      } else if (action === 'cancel') {
        // D11 — cancellation transitions take an optional resolution.
        showConfirm(id, 'cancel', btn, td, false);
      } else if (action === 'complete') {
        // D11 — success transitions require a resolution.
        showConfirm(id, 'complete', btn, td, true);
      } else if (action === 'fail') {
        // D11 — failure transitions require a resolution.
        showConfirm(id, 'fail', btn, td, true);
      } else if (action === 'transition') {
        // Generic transition for plugin-contributed types whose
        // destination state has no recognized terminal attr (per D10
        // bottom branch / D11 skipped-confirm). Walks straight to the
        // tool with no resolution input.
        doGenericTransition(id, btn.dataset.target, btn, td);
      } else if (action === 'repost') {
        openRepost(writ);
      } else if (action === 'unlink') {
        doUnlink(btn.dataset.source, btn.dataset.target, btn.dataset.label, btn, id);
      } else if (action === 'addlink') {
        const targetInput = document.getElementById(`link-target-${id}`);
        const labelInput = document.getElementById(`link-label-${id}`);
        const kindSelect = document.getElementById(`link-kind-${id}`);
        const errEl = document.getElementById(`link-error-${id}`);
        const kindValue = kindSelect ? kindSelect.value : '';
        doAddLink(id, targetInput.value.trim(), labelInput.value.trim(), kindValue, btn, errEl, targetInput, labelInput, kindSelect);
      }
    }

    /**
     * Fire a generic transition (no resolution input). Used for
     * destination states that carry no recognized terminal attr — the
     * page has no way to derive a confirmation prompt label, so it just
     * fires the request and refreshes. There is no global
     * /api/writ/transition route today; routes exist for the named
     * actions (publish/complete/fail/cancel). When this branch is
     * reached without a known route, surface an error so the operator
     * knows the type's machine declared a transition the page does not
     * yet have a tool for.
     */
    async function doGenericTransition(id, target, btn, td) {
      const errEl = td.querySelector(`#action-error-${id}`);
      clearError(errEl);
      showError(errEl, `No client route for transition to "${target}". The Clerk currently exposes per-action routes (publish/complete/fail/cancel); plugin types declaring additional transitions need their own route.`);
    }

    async function doSaveEdit(id, btn, td) {
      const errEl = document.getElementById(`edit-error-${id}`);
      const successEl = document.getElementById(`edit-success-${id}`);
      clearError(errEl);
      clearError(successEl);
      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Saving...';
      try {
        const title = document.getElementById(`edit-title-${id}`).value.trim();
        const body = document.getElementById(`edit-body-${id}`).value;
        const typeEl = document.getElementById(`edit-type-${id}`);
        const codexEl = document.getElementById(`edit-codex-${id}`);

        if (!title) { showError(errEl, 'Title is required.'); return; }

        const payload = { id, title, body };
        if (typeEl) payload.type = typeEl.value;
        if (codexEl) payload.codex = codexEl.value;
        await api('POST', '/api/writ/edit', payload);

        // Update the writ in the local forest.
        const writ = await api('GET', `/api/writ/show?id=${encodeURIComponent(id)}`);
        replaceWritInForest(forest, id, writ);

        // Update the row in-place. The title cell carries the toggle and
        // padding from renderTable, so re-render it the same way rather
        // than wiping its content.
        const row = document.querySelector(`tr.writ-row[data-id="${id}"]`);
        if (row) {
          const cells = row.querySelectorAll('td');
          const titleCell = cells[1];
          if (titleCell) {
            // Preserve the existing toggle (collapse state lives on the DOM toggle).
            const toggle = titleCell.querySelector('.row-toggle');
            const toggleHtml = toggle ? toggle.outerHTML : '';
            titleCell.innerHTML = toggleHtml + escHtml(writ.title ?? '');
          }
          if (cells[2]) cells[2].textContent = writ.type ?? '';
        }

        successEl.textContent = 'Saved.';
        successEl.style.display = 'block';
        setTimeout(() => { successEl.style.display = 'none'; }, 2000);
      } catch (e) {
        showError(errEl, e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function doPublish(id, btn, td) {
      const errEl = td.querySelector(`#action-error-${id}`);
      clearError(errEl);
      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Publishing...';
      try {
        await api('POST', '/api/writ/publish', { id });
        await refreshDetail(id);
        updateRowPhase(id);
        updateRowActions(id);
      } catch (e) {
        showError(errEl, e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    function showConfirm(id, action, btn, td, resRequired) {
      const area = document.getElementById(`confirm-area-${id}`);
      const errEl = td.querySelector(`#action-error-${id}`);
      clearError(errEl);
      if (!area) return;

      const label = resRequired
        ? `Resolution (required)`
        : `Resolution (optional)`;
      const confirmLabel = action === 'cancel' ? 'Confirm Cancel'
        : action === 'complete' ? 'Confirm Complete'
        : 'Confirm Fail';

      area.innerHTML = `
        <div class="confirm-section">
          <label>${label}</label>
          <input type="text" id="confirm-res-${id}" placeholder="${label}">
          <button class="btn ${action === 'complete' ? 'btn--success' : 'btn--danger'}"
            id="confirm-btn-${id}" ${resRequired ? 'disabled' : ''}>
            ${confirmLabel}
          </button>
          <div class="error-msg" id="confirm-error-${id}" style="display:none"></div>
        </div>`;

      const resInput = document.getElementById(`confirm-res-${id}`);
      const confirmBtn = document.getElementById(`confirm-btn-${id}`);
      const confirmErr = document.getElementById(`confirm-error-${id}`);

      if (resRequired) {
        resInput.addEventListener('input', () => {
          confirmBtn.disabled = !resInput.value.trim();
          clearError(confirmErr);
        });
      } else {
        resInput.addEventListener('input', () => clearError(confirmErr));
      }

      confirmBtn.addEventListener('click', async () => {
        const resolution = resInput.value.trim() || undefined;
        clearError(confirmErr);
        confirmBtn.disabled = true;
        confirmBtn.textContent = `${confirmLabel.replace('Confirm ', '')}ing...`;
        try {
          const body = { id, ...(resolution ? { resolution } : {}) };
          if (action === 'cancel') await api('POST', '/api/writ/cancel', body);
          else if (action === 'complete') await api('POST', '/api/writ/complete', body);
          else if (action === 'fail') await api('POST', '/api/writ/fail', body);
          await refreshDetail(id);
          updateRowPhase(id);
          updateRowActions(id);
          area.innerHTML = '';
        } catch (e) {
          showError(confirmErr, e.message);
          confirmBtn.disabled = false;
          confirmBtn.textContent = confirmLabel;
        }
      });
    }

    async function doUnlink(sourceId, targetId, label, btn, writId) {
      const orig = btn.textContent;
      btn.disabled = true;
      try {
        await api('POST', '/api/writ/unlink', { sourceId, targetId, label });
        await refreshDetail(writId);
      } catch (e) {
        alert(`Unlink failed: ${e.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function doAddLink(writId, targetId, label, kind, btn, errEl, targetInput, labelInput, kindSelect) {
      clearError(errEl);
      if (!targetId || !label) {
        showError(errEl, 'Target writ id and link label are required.');
        return;
      }
      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Linking...';
      try {
        const payload = { sourceId: writId, targetId, label };
        if (kind) payload.kind = kind;
        await api('POST', '/api/writ/link', payload);
        targetInput.value = '';
        labelInput.value = '';
        if (kindSelect) kindSelect.value = '';
        await refreshDetail(writId);
      } catch (e) {
        showError(errEl, e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function refreshDetail(id) {
      let writ;
      try {
        writ = await api('GET', `/api/writ/show?id=${encodeURIComponent(id)}`);
      } catch (e) {
        return;
      }
      // Update the writ in the local forest.
      replaceWritInForest(forest, id, writ);

      // Fetch full descendant tree if there are any children.
      if (writ.children && writ.children.items.length > 0) {
        try {
          writ._descendantTree = await buildDescendantTree(id);
        } catch (e) {
          writ._descendantTree = null;
        }
      }

      // Re-render detail content
      const content = document.getElementById('detail-content');
      if (content) {
        content.innerHTML = renderDetail(writ);
        wireDetailEvents(content, writ);
      }

      // Also refresh the list view row
      updateRowPhase(id);
      updateRowActions(id);
    }

    function updateRowPhase(id) {
      const node = findInForest(forest, id);
      const writ = node?.writ;
      if (!writ) return;
      const row = document.querySelector(`tr.writ-row[data-id="${id}"]`);
      if (!row) return;
      // Update phase badge cell (1st column, index 0)
      const cells = row.querySelectorAll('td');
      if (cells[0]) cells[0].innerHTML = phaseBadge(writ);
    }

    // ── Detail view ──────────────────────────────────────────────────

    /**
     * Render the not-found empty state inside the detail view for an
     * unresolvable id. Per D16, the URL param is never rewritten — we
     * surface the failure honestly so the operator can recover (e.g. by
     * editing the url, hitting Back, or copy-pasting a corrected id).
     */
    function renderDetailNotFound(id) {
      document.getElementById('writ-list-view').style.display = 'none';
      document.getElementById('writ-detail-view').style.display = '';
      document.getElementById('detail-title').textContent = 'Writ not found';

      const oldSubtitle = document.getElementById('detail-id-subtitle');
      if (oldSubtitle) oldSubtitle.remove();

      const subtitle = document.createElement('div');
      subtitle.id = 'detail-id-subtitle';
      subtitle.style.cssText = 'margin-top:0.25rem;margin-bottom:0.75rem;font-size:0.875rem;opacity:0.7';
      subtitle.innerHTML = '<code>' + escHtml(id) + '</code>';
      document.getElementById('detail-title').after(subtitle);

      const content = document.getElementById('detail-content');
      content.innerHTML =
        `<div class="empty-state" style="padding:1.5rem">` +
        `No writ with id <code>${escHtml(id)}</code> exists. ` +
        `It may have been deleted, or the id may be mistyped.</div>`;
    }

    /**
     * Open the detail view for `id`. Centralises the URL push so every
     * caller (row click, parent link, child detail row, link-id target,
     * overflow row, deep-link init, popstate) gets the URL contract for
     * free (D12). Pass `{ skipUrlPush: true }` from the popstate handler
     * to avoid double-pushing when the browser is already at the right
     * URL — every other entry point should push.
     *
     * D16: a missing/deleted/mistyped id renders a "not found" empty
     * state inside the detail panel without rewriting the URL.
     */
    async function showWritDetail(id, opts) {
      const skipUrlPush = !!(opts && opts.skipUrlPush);

      let writ;
      try {
        writ = await api('GET', '/api/writ/show?id=' + encodeURIComponent(id));
      } catch (e) {
        console.error('Failed to load writ detail:', e);
        if (!skipUrlPush) window.NexusUrl.update({ writ: id }, { push: true });
        renderDetailNotFound(id);
        return;
      }

      // Update the writ in the local forest if it's already present.
      replaceWritInForest(forest, id, writ);

      // Fetch full descendant tree for the detail children table. The detail
      // view renders deep descendants (not just direct children) so clicking
      // into a writ does not collapse visible depth back to 1.
      if (writ.children && writ.children.items.length > 0) {
        try {
          writ._descendantTree = await buildDescendantTree(id);
        } catch (e) {
          writ._descendantTree = null;
        }
      }

      // Centralised URL push — every callsite into showWritDetail emits
      // ?writ=ID for free, except the popstate-driven path which would
      // otherwise re-push the current URL. Detail open is a navigation
      // event (pushes), per the D5 push-vs-replace split.
      if (!skipUrlPush) window.NexusUrl.update({ writ: id }, { push: true });

      // Toggle views
      document.getElementById('writ-list-view').style.display = 'none';
      document.getElementById('writ-detail-view').style.display = '';
      document.getElementById('detail-title').textContent = writ.title ?? writ.id;

      // Remove any previous subtitle
      const oldSubtitle = document.getElementById('detail-id-subtitle');
      if (oldSubtitle) oldSubtitle.remove();

      // Create subtitle with ID and copy button
      const subtitle = document.createElement('div');
      subtitle.id = 'detail-id-subtitle';
      subtitle.style.cssText = 'margin-top:0.25rem;margin-bottom:0.75rem;font-size:0.875rem;opacity:0.7';
      subtitle.innerHTML = '<code>' + writ.id + '</code> <button class="btn copy-id-btn" style="padding:0.1rem 0.3rem;font-size:0.7rem;cursor:pointer">📋</button>';

      const detailTitle = document.getElementById('detail-title');
      detailTitle.after(subtitle);

      // Wire copy button
      const detailCopyBtn = subtitle.querySelector('.copy-id-btn');
      detailCopyBtn.addEventListener('click', () => {
        copyToClipboard(writ.id, detailCopyBtn);
      });

      const content = document.getElementById('detail-content');
      content.innerHTML = renderDetail(writ);
      wireDetailEvents(content, writ);
    }

    /** Switch back from the detail view to the list view. Centralised so
     *  the URL clear (`{ writ: null }`) and the DOM toggle stay paired.
     *  Per D11 we never call `history.back()` — clicking "Back to list"
     *  pushes a clean URL so the operator's forward button keeps doing
     *  what they expect. */
    function showWritList(opts) {
      const skipUrlPush = !!(opts && opts.skipUrlPush);
      document.getElementById('writ-detail-view').style.display = 'none';
      document.getElementById('writ-list-view').style.display = '';
      if (!skipUrlPush) window.NexusUrl.update({ writ: null }, { push: true });
    }

    // ── Data loading ────────────────────────────────────────────────────

    async function loadWrits(replace = true) {
      if (replace) {
        offset = 0;
        forest = [];
        // Per-row collapse state is page-local — wipe it on a full reload so
        // the deep-descendant view matches the freshly-fetched tree.
        collapsedSet = new Set();
      }

      // Single RPC: ask the server for a depth-bounded forest of root writs
      // matching the current filters. Fetch one level past the visual cap so
      // the renderer can detect (and summarize) hidden subtrees.
      const params = new URLSearchParams({
        rootLimit: String(LIMIT),
        rootOffset: String(offset),
        depth: String(DEPTH_CAP + 1),
        format: 'json',
      });
      if (currentClassification) params.set('classification', currentClassification);
      if (currentType.size === 0) {
        // No types selected — show empty state without hitting the API.
        if (replace) { forest = []; }
        renderTable();
        document.getElementById('load-more-row').style.display = 'none';
        return;
      }
      // When every currently-declared type is selected (the "All" state), omit
      // the type filter entirely so the server returns writs of every type —
      // including legacy/retired types no longer in `knownTypes`. Sending
      // ?type=X for each declared type would silently hide writs whose type
      // has been removed from guild config (e.g. after a type-collapse).
      const allSelected = knownTypes.length > 0 && knownTypes.every(t => currentType.has(t));
      if (!allSelected) {
        for (const t of currentType) {
          params.append('type', t);
        }
      }

      let result;
      try {
        result = await api('GET', `/api/writ/tree?${params}`);
      } catch (e) {
        console.error('Failed to load writs:', e);
        return;
      }

      // result is a forest (WritTree[]); each element is { writ, children }.
      const batch = Array.isArray(result) ? result : [];
      if (replace) {
        forest = batch;
      } else {
        forest = forest.concat(batch);
      }

      offset += batch.length;

      renderTable();

      // Load-more is only useful when the latest batch filled the page —
      // a short batch means the server has no more roots to give.
      const loadMoreRow = document.getElementById('load-more-row');
      if (batch.length < LIMIT) {
        loadMoreRow.style.display = 'none';
      } else {
        loadMoreRow.style.display = 'block';
      }
    }

    async function loadLinkKinds() {
      try {
        const kinds = await api('GET', '/api/writ/link-kinds?json=true');
        linkKinds = Array.isArray(kinds) ? kinds : [];
      } catch (e) {
        console.error('Failed to load link kinds:', e);
        linkKinds = [];
      }
    }

    async function loadWritTypes() {
      let types;
      try {
        types = await api('GET', '/api/writ/types');
      } catch (e) {
        console.error('Failed to load writ types:', e);
        return;
      }

      const sel = document.getElementById('post-type-select');
      sel.innerHTML = '';
      for (const t of types) {
        const opt = document.createElement('option');
        opt.value = t.name;
        opt.textContent = t.name;
        if (t.description) opt.title = t.description;
        if (t.isDefault) { opt.selected = true; opt.dataset.isDefault = 'true'; }
        sel.appendChild(opt);
      }

      // Stash declared type names for the "all selected → skip filter" check in loadWrits.
      knownTypes = types.map(t => t.name);

      // Build the type-config map keyed by name. Every entry carries
      // its full state catalogue (T1 widening) so the shared
      // derivePresentation helper can resolve classification, attrs,
      // badge classes, and allowedTransitions for any writ on the page.
      writTypesByName = new Map();
      for (const t of types) {
        writTypesByName.set(t.name, t);
      }

      // Build type-filter buttons
      buildTypeFilterBar(types);
    }

    function buildTypeFilterBar(types) {
      const bar = document.getElementById('type-filter-bar');
      // Clear existing buttons (keep the label span)
      bar.innerHTML = '<span style="font-size:0.875rem;opacity:0.6">Type:</span>';

      // "All" button. Carries `.filter-btn` so the shared
      // `.filter-btn.active-filter` rule paints the active fill (D6);
      // `.type-filter-btn` stays as a JS selector hook only.
      const allBtn = document.createElement('button');
      allBtn.className = 'btn filter-btn type-filter-btn';
      allBtn.dataset.type = '';
      allBtn.textContent = 'All';
      bar.appendChild(allBtn);

      // One button per known type
      for (const t of types) {
        const btn = document.createElement('button');
        btn.className = 'btn filter-btn type-filter-btn';
        btn.dataset.type = t.name;
        btn.textContent = t.name;
        if (t.description) btn.title = t.description;
        bar.appendChild(btn);
      }

      // Wire click handlers
      bar.querySelectorAll('.type-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => setTypeFilter(btn.dataset.type));
      });

      // Default: select all types
      currentType = new Set(types.map(t => t.name));
      bar.querySelectorAll('.type-filter-btn').forEach(btn => {
        btn.classList.add('active-filter');
      });
    }

    async function loadCodexes() {
      const sel = document.getElementById('post-codex-select');
      const errEl = document.getElementById('post-codex-error');
