      const submitBtn = document.getElementById('post-submit-btn');

      let codexes;
      try {
        codexes = await api('GET', '/api/codex/list');
      } catch (e) {
        console.error('Failed to load codexes:', e);
        sel.innerHTML = '<option value="">No codexes available</option>';
        sel.disabled = true;
        submitBtn.disabled = true;
        showError(errEl, 'Could not load codexes. A codex is required to post writs.');
        return;
      }

      if (!codexes || codexes.length === 0) {
        sel.innerHTML = '<option value="">No codexes configured</option>';
        sel.disabled = true;
        submitBtn.disabled = true;
        showError(errEl, 'No codexes are configured. A codex is required to post writs.');
        return;
      }

      // Populate dropdown
      sel.innerHTML = '';
      if (codexes.length > 1) {
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Select a codex…';
        sel.appendChild(placeholder);
      }
      for (const c of codexes) {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name;
        if (c.cloneStatus !== 'ready') opt.title = `Status: ${c.cloneStatus}`;
        sel.appendChild(opt);
      }
      // Pre-select if only one
      if (codexes.length === 1) {
        sel.value = codexes[0].name;
      }
      sel.disabled = false;
      submitBtn.disabled = false;
      clearError(errEl);
    }

    // ── Post form ───────────────────────────────────────────────────────

    function openPostForm() {
      const section = document.getElementById('post-section');
      section.classList.add('open');
      document.getElementById('post-title-input').focus();
    }

    function closePostForm() {
      const section = document.getElementById('post-section');
      section.classList.remove('open');
      // Reset repost state
      repostSourceId = null;
      document.getElementById('post-title').textContent = 'New Writ';
    }

    function clearPostForm() {
      document.getElementById('post-title-input').value = '';
      document.getElementById('post-body-input').value = '';
      document.getElementById('post-draft-checkbox').checked = false;
      clearError(document.getElementById('post-error'));
      clearError(document.getElementById('post-warn'));
      clearError(document.getElementById('post-codex-error'));
      // Reset type to default
      const typeSel = document.getElementById('post-type-select');
      for (const opt of typeSel.options) {
        if (opt.dataset.isDefault === 'true') opt.selected = true;
      }
      // Reset codex to first item (pre-selected if single, placeholder if multiple)
      const codexSel = document.getElementById('post-codex-select');
      if (!codexSel.disabled && codexSel.options.length > 0) {
        codexSel.selectedIndex = 0;
      }
    }

    function openRepost(writ) {
      // If in detail view, switch back to list view first. Routes
      // through showWritList so the URL also clears `?writ=` — repost
      // operates on the source writ but lands the operator on the new
      // (drafting) form, so the param no longer reflects state.
      showWritList();
      openPostForm();
      document.getElementById('post-title').textContent = 'Repost Writ';
      document.getElementById('post-title-input').value = `[Repost] ${writ.title ?? ''}`;
      document.getElementById('post-body-input').value = writ.body ?? '';
      // Set type
      const typeSel = document.getElementById('post-type-select');
      for (const opt of typeSel.options) {
        if (opt.value === writ.type) {
          opt.selected = true;
          break;
        }
      }
      // Set codex if available
      if (writ.codex) {
        const codexSel = document.getElementById('post-codex-select');
        for (const opt of codexSel.options) {
          if (opt.value === writ.codex) {
            opt.selected = true;
            break;
          }
        }
      }
      repostSourceId = writ.id;
      // Scroll to form
      document.getElementById('post-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function submitPostForm() {
      const titleInput = document.getElementById('post-title-input');
      const bodyInput = document.getElementById('post-body-input');
      const typeSelect = document.getElementById('post-type-select');
      const codexSelect = document.getElementById('post-codex-select');
      const submitBtn = document.getElementById('post-submit-btn');
      const errEl = document.getElementById('post-error');
      const warnEl = document.getElementById('post-warn');

      clearError(errEl);
      clearError(warnEl);

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();
      const type = typeSelect.value;
      const codex = codexSelect.value || undefined;
      const draft = document.getElementById('post-draft-checkbox').checked;

      if (!title) { showError(errEl, 'Title is required.'); return; }
      if (!body)  { showError(errEl, 'Body is required.'); return; }
      if (!codex) { showError(errEl, 'A codex is required.'); codexSelect.focus(); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = draft ? 'Saving Draft...' : 'Posting...';

      try {
        const payload = { title, body, type, ...(codex ? { codex } : {}), ...(draft ? { draft: true } : {}) };
        const newWrit = await api('POST', '/api/commission/post', payload);

        // If reposting, create retries link
        if (repostSourceId) {
          const srcId = repostSourceId;
          repostSourceId = null;
          try {
            await api('POST', '/api/writ/link', { sourceId: newWrit.id, targetId: srcId, label: 'retries' });
          } catch (le) {
            warnEl.textContent = `Writ posted but link to original failed: ${le.message}. You can add the link manually.`;
            warnEl.style.display = 'block';
          }
        }

        clearPostForm();
        closePostForm();
        await loadWrits(true);
      } catch (e) {
        showError(errEl, e.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Post Writ';
        document.getElementById('post-draft-checkbox').checked = false;
      }
    }

    // ── Filter / sort ───────────────────────────────────────────────────

    function setActiveFilter(classification) {
      currentClassification = classification;
      // Scope the visual toggle to State buttons (those carrying
      // `data-classification`). Other `.filter-btn` toggles in the toolbar
      // (Children, Cancelled, type-filter pills) own their own state.
      document.querySelectorAll('.filter-btn[data-classification]').forEach(btn => {
        btn.classList.toggle('active-filter', btn.dataset.classification === classification);
      });
      writeFiltersToUrl();
      loadWrits(true);
    }

    function setTypeFilter(type) {
      const bar = document.getElementById('type-filter-bar');
      const allBtn = bar.querySelector('.type-filter-btn[data-type=""]');
      const typeBtns = [...bar.querySelectorAll('.type-filter-btn:not([data-type=""])')];
      const allTypeNames = typeBtns.map(b => b.dataset.type);

      if (type === '') {
        // "All" is a true toggle (D8): if every type is currently
        // selected, clear; otherwise select every type. There is no
        // intermediate "All means partial" state.
        const allSelected = allTypeNames.length > 0 && allTypeNames.every(t => currentType.has(t));
        currentType = allSelected ? new Set() : new Set(allTypeNames);
      } else {
        // Individual type click: toggle exactly that type (D7). The
        // previous behaviour of "All-active collapses to one type" is
        // gone — clicking one pill always leaves the others untouched.
        if (currentType.has(type)) {
          currentType.delete(type);
        } else {
          currentType.add(type);
        }
      }

      // Update button visual state. The All button is filled iff every
      // type is currently selected — that mirrors the operator's mental
      // model of "All means: I have every type on" without ever
      // claiming "All" when it isn't true.
      const nowAllActive = allTypeNames.length > 0 && allTypeNames.every(t => currentType.has(t));
      allBtn.classList.toggle('active-filter', nowAllActive);
      typeBtns.forEach(btn => {
        btn.classList.toggle('active-filter', currentType.has(btn.dataset.type));
      });

      writeFiltersToUrl();
      loadWrits(true);
    }

    // ── Event wiring ────────────────────────────────────────────────────

    document.getElementById('btn-new-writ').addEventListener('click', () => {
      const section = document.getElementById('post-section');
      if (section.classList.contains('open') && !repostSourceId) {
        closePostForm();
      } else {
        openPostForm();
      }
    });

    document.getElementById('btn-refresh').addEventListener('click', () => loadWrits(true));

    document.getElementById('back-btn').addEventListener('click', () => {
      // D11: push a clean URL via showWritList → NexusUrl.update, never
      // call history.back(). Survives deep-link entries (the operator
      // may have arrived directly at ?writ=ID with no prior list-view
      // entry to pop back to), and keeps Forward navigation predictable.
      showWritList();
    });

    document.getElementById('btn-toggle-children').addEventListener('click', () => {
      showChildren = !showChildren;
      document.getElementById('btn-toggle-children').classList.toggle('active-filter', showChildren);
      writeFiltersToUrl();
      renderTable();
    });

    document.getElementById('btn-toggle-cancelled').addEventListener('click', () => {
      // Cancelled toggle: filled = showing cancelled writs. Independent
      // of the State filter (D2) — a State=terminal selection still hides
      // cancelled rows when the toggle is off.
      showCancelled = !showCancelled;
      document.getElementById('btn-toggle-cancelled').classList.toggle('active-filter', showCancelled);
      writeFiltersToUrl();
      renderTable();
    });

    document.getElementById('post-submit-btn').addEventListener('click', submitPostForm);

    document.getElementById('load-more-btn').addEventListener('click', () => loadWrits(false));

    // Only State buttons (those with `data-classification`) trigger the
    // classification filter. The Children / Cancelled / type-filter pills
    // also carry `.filter-btn` (for the active-filter fill) but own their
    // own click wiring elsewhere.
    document.querySelectorAll('.filter-btn[data-classification]').forEach(btn => {
      btn.addEventListener('click', () => setActiveFilter(btn.dataset.classification));
    });

    document.getElementById('search-input').addEventListener('input', e => {
      searchText = e.target.value;
      writeFiltersToUrl();
      renderTable();
    });

    document.querySelectorAll('.th-sortable').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (sortCol === col) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortCol = col;
          sortDir = 'asc';
        }
        writeFiltersToUrl();
        renderTable();
      });
    });

    // ── Browser navigation ──────────────────────────────────────────────

    /**
     * Reflect browser navigation (Back / Forward) into the page's view
     * state. The popstate handler now restores the full filter state in
     * addition to the detail-id state — Back from a deep-linked
     * filtered URL must reproduce the original filtered view, not just
     * its detail open/close axis (commission moix23w5).
     *
     * The browser has already updated the URL by the time popstate
     * fires, so showWritDetail / showWritList run with skipUrlPush; the
     * filter restore reads from `window.location.search` directly via
     * readFiltersFromUrl and never writes back.
     */
    window.addEventListener('popstate', () => {
      const writId = readFiltersFromUrl();
      syncFilterUiFromState();
      if (writId) {
        showWritDetail(writId, { skipUrlPush: true });
      } else {
        showWritList({ skipUrlPush: true });
        // Refresh the list with the restored filter state.
        loadWrits(true);
      }
    });

    // ── Init ────────────────────────────────────────────────────────────
    loadCodexes();
    loadLinkKinds();

    // Deep-link: ?writ=ID and filter state
    (async function () {
      // Load writ types first so currentType default is set and known
      // type names are populated — the URL-restore step needs them to
      // validate ?type= against the registry.
      await loadWritTypes();

      // Read URL filter state AFTER buildTypeFilterBar (inside
      // loadWritTypes) so default-fill does not clobber URL-restored
      // selections. readFiltersFromUrl validates each value and routes
      // unknowns to the fail-loud banner per D6.
      var writId = readFiltersFromUrl();
      syncFilterUiFromState();

      await loadWrits(true);

      if (writId) {
        // The URL already carries the id — pass skipUrlPush so we don't
        // re-push the same querystring. A missing/deleted id falls
        // through to renderDetailNotFound (D16) — the URL is preserved.
        showWritDetail(writId, { skipUrlPush: true });
      }
    })();
  })();
  </script>
</body>
</html>
