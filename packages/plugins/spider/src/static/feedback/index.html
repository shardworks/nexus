<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback</title>
  <link rel="stylesheet" href="feedback.css">
</head>
<body>
<main style="padding: 24px;">
  <h1>Feedback</h1>

  <!--
    URL-state validation banner (D6 fail-loud). Shown when the page is
    loaded with an invalid filter value (e.g. ?status=bogus). The banner
    appends one line per invalid value; pages do not silently fall back
    to a default.
  -->
  <div id="url-error-banner" class="error-msg" style="display:none;margin-bottom:12px;padding:0.6rem 0.8rem;background:var(--bg2,#1a1b26);border:1px solid var(--red,#f7768e);border-radius:6px;font-size:0.9rem;color:var(--red,#f7768e)"></div>

  <!-- List view -->
  <div id="list-view">
    <div class="toolbar">
      <select id="status-filter">
        <option value="pending">pending</option>
        <option value="completed">completed</option>
        <option value="rejected">rejected</option>
      </select>
    </div>
    <div id="request-list"></div>
    <div id="list-empty" class="empty-state" style="display:none">No pending requests.</div>
  </div>

  <!-- Detail view -->
  <div id="detail-view" style="display:none">
    <a href="#" class="back-link" id="back-btn">&larr; Back to list</a>
    <div id="detail-banner"></div>
    <div id="detail-message"></div>
    <div id="questions-container"></div>
    <div id="action-bar"></div>
  </div>

  <!-- Success toast -->
  <div id="success-toast" class="success-toast" style="display:none"></div>
</main>
<script src="feedback.js"></script>
</body>
</html>
