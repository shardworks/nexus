name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure git identity (needed by tests that shell out to git)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@shardworks.dev"

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      # Runs all tests with V8 coverage enabled, then aggregates per-package
      # lcov files and enforces the monorepo-wide threshold floor (see
      # scripts/coverage-report.ts → THRESHOLDS). Replaces the previous
      # `pnpm test` step — coverage instrumentation also runs the full suite,
      # so this is one pass rather than two.
      - run: pnpm coverage
